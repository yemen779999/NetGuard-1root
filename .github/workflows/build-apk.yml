name: Build Debug APK & Publish Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          echo "Detected Java Version string: $JAVA_VER"
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Java version could not be detected."
            exit 1
          fi
          MAJOR_VERSION=$(echo "$JAVA_VER" | awk -F '.' '{if ($1 == "1") print $2; else print $1}')
          echo "Detected Java Major Version: $MAJOR_VERSION"
          if [ -z "$MAJOR_VERSION" ]; then
            echo "Error: Java major version could not be parsed."
            exit 1
          fi
          if [ "$MAJOR_VERSION" -lt 17 ]; then
            echo "Error: Java major version $MAJOR_VERSION is lower than 17."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "debug.keystore already exists."
          else
            echo "Generating debug.keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -alias androiddebugkey \
              -storepass android \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          if [ ! -f "./debug.keystore" ]; then
            echo "Error: ./debug.keystore failed to be created."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          TARGET_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$TARGET_APK" ]; then
            echo "Error: Target APK $TARGET_APK is missing!"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Searching inside app/build/outputs/apk:"
              find app/build/outputs/apk -name "*.apk"
            fi
            exit 1
          fi

          if [ -f "$TARGET_APK" ] && [ -s "$TARGET_APK" ] && [[ "$TARGET_APK" == *.apk ]] && [ "$TARGET_APK" = "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Verified APK successfully: $TARGET_APK"
          else
            echo "Error: APK validation failed for $TARGET_APK"
            exit 1
          fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TEMP_DIR=$(mktemp -d)
          RAW_REPO="${{ github.repository }}"
          REPO_NAME=$(echo "$RAW_REPO" | awk -F '/' '{print $2}')
          SAFE_REPO_NAME=$(echo "$REPO_NAME" | sed 's/[^a-zA-Z0-9_-]/-/g')
          RUN_NUM="${{ github.run_number }}"
          RELEASE_FILENAME="${SAFE_REPO_NAME}-debug-build-${RUN_NUM}.apk"
          ASSET_PATH="${TEMP_DIR}/${RELEASE_FILENAME}"

          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET_PATH"

          echo "asset_path=${ASSET_PATH}" >> $GITHUB_OUTPUT
          echo "asset_name=${RELEASE_FILENAME}" >> $GITHUB_OUTPUT

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "Error: Release asset validation failed for $ASSET_PATH"
            exit 1
          fi

          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          TITLE="Debug APK Build #${{ github.run_number }}"
          TARGET_COMMIT="${{ github.sha }}"

          NOTES=$(cat <<EOF
          This is an automatically generated debug APK.
          The APK was built by GitHub Actions.
          - GitHub Actions Run Number: ${{ github.run_number }}
          - GitHub Actions Run Attempt: ${{ github.run_attempt }}
          - Source Commit SHA: ${{ github.sha }}

          Notes:
          - The APK is intended for testing.
          - The APK is not a Play Store production release.
          - The APK is signed only with a temporary debug keystore.
          EOF
          )

          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "$TARGET_COMMIT" \
            --title "$TITLE" \
            --notes "$NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"
          OUTCOME="${{ steps.publish_release.outcome }}"

          if [ "$OUTCOME" = "success" ]; then
            echo "Release publishing succeeded!"
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            {
              echo "### Release Published Successfully"
              echo "The debug APK can be downloaded directly from the release page:"
              echo "[$RELEASE_URL]($RELEASE_URL)"
              echo ""
              echo "Asset filename: \`$ASSET_NAME\`"
              echo ""
              echo "The normal GitHub Actions artifact named \`app-debug-apk\` is also available as a backup."
            } >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning::Release publishing failed or was skipped."
            echo "The APK build succeeded."
            echo "The GitHub Actions artifact named app-debug-apk remains available."
            {
              echo "### Release Publishing Warning"
              echo "Release publishing failed or did not complete."
              echo "However, the APK build succeeded and the normal Actions artifact named \`app-debug-apk\` remains available for download."
            } >> $GITHUB_STEP_SUMMARY
          fi

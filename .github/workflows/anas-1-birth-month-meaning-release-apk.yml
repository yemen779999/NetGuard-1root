name: anas-1-birth-month-meaning-release-apk

on:
  workflow_dispatch:

jobs:
  build-first-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Check Android project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "The Gradle wrapper was not found in the repository root."
            exit 1
          fi

          chmod +x gradlew

      - name: Remove stale Gradle project cache
        run: |
          rm -rf .gradle
          find . -type d -name build -prune -exec rm -rf {} +

      - name: Check required secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ACTUAL_STORE_PASS="${KEYSTORE_PASSWORD:-android}"
          ACTUAL_KEY_ALIAS="${KEY_ALIAS:-upload}"
          ACTUAL_KEY_PASS="${KEY_PASSWORD:-android}"

          echo "KEYSTORE_PASSWORD=$ACTUAL_STORE_PASS" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=$ACTUAL_KEY_ALIAS" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$ACTUAL_KEY_PASS" >> "$GITHUB_ENV"

      - name: Generate release keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore upload-keystore.jks \
            -storetype JKS \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" \
            -keypass "$KEY_PASSWORD" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Release Key, OU=Mobile Apps, O=App Developer" \
            -noprompt

      - name: Verify release keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ! -s "upload-keystore.jks" ]; then
            echo "The release keystore was not generated."
            exit 1
          fi

          keytool -list \
            -keystore upload-keystore.jks \
            -storepass "$KEYSTORE_PASSWORD"

      - name: Convert keystore to Base64
        run: |
          base64 -w 0 upload-keystore.jks > upload-keystore-base64.txt

          if [ ! -s "upload-keystore-base64.txt" ]; then
            echo "The Base64 keystore backup was not generated."
            exit 1
          fi

      - name: Export signing path
        run: |
          echo "ANDROID_KEYSTORE_PATH=$GITHUB_WORKSPACE/upload-keystore.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Find signed release APK
        id: find_apk
        shell: bash
        run: |
          APK_PATH=$(find . -type f -path "*/build/outputs/apk/release/*.apk" ! -name "*unsigned*" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            echo "No signed release APK was found."
            echo "Available release APK files:"
            find . -type f -path "*/build/outputs/apk/release/*.apk" -print || true
            exit 1
          fi

          echo "Signed release APK generated successfully:"
          ls -lh "$APK_PATH"

          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Verify APK signature
        shell: bash
        run: |
          APK_PATH="${{ steps.find_apk.outputs.apk_path }}"

          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner 2>/dev/null | sort -V | tail -n 1)

          if [ -z "$APKSIGNER" ]; then
            echo "apksigner was not found."
            exit 1
          fi

          "$APKSIGNER" verify --verbose --print-certs "$APK_PATH"

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: Signed-Release-APK
          path: ${{ steps.find_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload signing key backup
        uses: actions/upload-artifact@v4
        with:
          name: Signing-Key-Backup
          path: |
            upload-keystore.jks
            upload-keystore-base64.txt
          if-no-files-found: error
          retention-days: 1
